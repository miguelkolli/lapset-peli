x.font=`${op.size||50}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(op.sticker,op.x,op.y);ctx.restore()}function drawImageOp(ctx,op){const img=new Image();img.onload=()=>ctx.drawImage(img,op.x,op.y,op.w,op.h);img.src=op.data}
document.getElementById('imageBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const img=new Image();img.onload=()=>{const max=900,sc=Math.min(1,max/img.width,max/img.height),w=Math.round(img.width*sc),h=Math.round(img.height*sc),temp=document.createElement('canvas');temp.width=w;temp.height=h;temp.getContext('2d').drawImage(img,0,0,w,h);commitOp({type:'image',layer:activeLayer,x:(PW-w)/2,y:(PH-h)/2,w,h,data:temp.toDataURL('image/jpeg',.8)});URL.revokeObjectURL(img.src);e.target.value=''};img.src=URL.createObjectURL(file)};function composite(){const out=document.createElement('canvas');out.width=PW;out.height=PH;const c=out.getContext('2d');c.fillStyle='white';c.fillRect(0,0,PW,PH);[...canvases.keys()].sort((a,b)=>a-b).forEach(n=>c.drawImage(canvases.get(n),0,0));return out}document.getElementById('exportBtn').onclick=()=>{const a=document.createElement('a');a.download='alman-piirros.png';a.href=composite().toDataURL('image/png');a.click()};
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('AlmanPiirustusGalleria',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('drawings'))r.result.createObjectStore('drawings',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function dbPut(v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('drawings','readwrite');tx.objectStore('drawings').put(v);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function dbAll(){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('drawings').objectStore('drawings').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}async function dbDelete(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('drawings','readwrite');tx.objectStore('drawings').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function saveToGallery(){const name=prompt('Piirroksen nimi?','Minun piirros')||'Minun piirros';const preview=composite();const thumb=document.createElement('canvas');thumb.width=500;thumb.height=350;thumb.getContext('2d').drawImage(preview,0,0,500,350);const item={id:Date.now(),name,created:new Date().toISOString(),preview:thumb.toDataURL('image/jpeg',.72),ops:JSON.parse(JSON.stringify(currentOps()))};await dbPut(item);alert('Tallennettu galleriaan! 🎉')}async function showGallery(){document.getElementById('gallery').classList.add('on');const grid=document.getElementById('galleryGrid');grid.innerHTML='<div class="empty">Ladataan…</div>';let items=[];try{items=(await dbAll()).sort((a,b)=>b.id-a.id)}catch(e){grid.innerHTML='<div class="empty">Galleria ei auennut tässä selaimessa.</div>';return}if(!items.length){grid.innerHTML='<div class="empty">Ei vielä piirroksia. Tee taideteos ja paina 💾 Tallenna.</div>';return}grid.innerHTML='';items.forEach(it=>{const d=document.createElement('div');d.className='art';d.innerHTML=`<img src="${it.preview}"><strong></strong><small>${new Date(it.created).toLocaleString('fi-FI')}</small><div class="artBtns"><button>Avaa</button><button>Poista</button></div>`;d.querySelector('strong').textContent=it.name;const [openBtn,delBtn]=d.querySelectorAll('button');openBtn.onclick=()=>openDrawing(it);delBtn.onclick=async()=>{if(confirm('Poistetaanko piirros galleriasta?')){await dbDelete(it.id);showGallery()}};grid.appendChild(d)})}function resetCanvasesForOps(ops){let max=3;for(const op of ops)max=Math.max(max,op.layer||1);for(let i=1;i<=Math.min(MAX_LAYERS,max);i++)ensureLayer(i);layerCount=Math.min(MAX_LAYERS,max);setActiveLayer(Math.min(activeLayer,layerCount));redrawAll(ops);renderLayers()}function openDrawing(it){disconnect();localOps=JSON.parse(JSON.stringify(it.ops||[]));resetCanvasesForOps(localOps);document.getElementById('gallery').classList.remove('on');alert('Piirros avattu. Voit jatkaa muokkaamista! 🎨')}document.getElementById('saveGalleryBtn').onclick=saveToGallery;document.getElementById('galleryBtn').onclick=showGallery;document.getElementById('closeGallery').onclick=()=>document.getElementById('gallery').classList.remove('on');
async function connect(){const code=document.getElementById('roomCode').value.toUpperCase().replace(/[^A-Z0-9ÅÄÖ]/g,'').slice(0,8)||'TAIDE';document.getElementById('roomCode').value=code;disconnect();document.getElementById('status').textContent='Yhdistetään…';try{const mod=await import('https://esm.sh/@liveblocks/client@2.24.3');lbClient=lbClient||mod.createClient({publicApiKey:LIVEBLOCKS_KEY,throttle:80});const res=lbClient.enterRoom('lapset-piirto-'+code,{initialPresence:{cursor:null,name:document.getElementById('who').value,color}});room=res.room;leaveRoom=res.leave;const {root}=await room.getStorage();storageOps=root.get('ops');if(!storageOps){storageOps=new mod.LiveList([]);root.set('ops',storageOps)}if(localOps.length&&storageOps.toArray().length===0){localOps.forEach(op=>storageOps.push(op));localOps=[]}redrawAll(storageOps.toArray());unsubStorage=room.subscribe(storageOps,()=>redrawAll(storageOps.toArray()));unsubOthers=room.subscribe('others',others=>{document.getElementById('people').textContent='👥 '+(others.length+1);renderCursors(others)});room.subscribe('status',s=>document.getElementById('status').textContent=s==='connected'?'🟢 '+code:'🟡 '+s);document.getElementById('status').textContent='🟢 '+code}catch(err){console.warn(err);document.getElementById('status').textContent='🔌 Yksinpeli';room=null}}function disconnect(){if(unsubStorage)try{unsubStorage()}catch(e){};if(unsubOthers)try{unsubOthers()}catch(e){};if(leaveRoom)try{leaveRoom()}catch(e){};unsubStorage=unsubOthers=leaveRoom=null;room=null;storageOps=null;document.getElementById('cursors').innerHTML='';document.getElementById('people').textContent='👤 1'}function renderCursors(others){const box=document.getElementById('cursors');box.innerHTML='';others.forEach(o=>{const p=o.presence||{};if(!p.cursor)return;const d=document.createElement('div');d.className='cursor';d.style.left=(p.cursor.x-9)+'px';d.style.top=(p.cursor.y-9)+'px';d.style.borderColor=p.color||'#fff';d.innerHTML='<b>'+((p.name||'Kaveri').replace(/[<>]/g,''))+'</b>';box.appendChild(d)})}document.getElementById('connectBtn').onclick=connect;renderLayers();refreshSwatches();document.getElementById('colorDot').style.background=color;
</script></body></html>
